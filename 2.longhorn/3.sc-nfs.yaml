apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-rwx
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "2"
  fsType: "ext4"
  migratable: "false"
  nfsOptions: "vers=4.1,softerr,timeo=600,retrans=5"
allowVolumeExpansion: true
volumeBindingMode: Immediate