apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: krw-xrp
  namespace: kafka
  labels:
    strimzi.io/cluster: "krw-xrp"
spec:
  ## 토픽을 나눠서 저장 (병렬 저장, 읽기)
  partitions: 1
  ## 토픽을 복사해서 저장
  replicas: 1
  config:
    retention.ms: 10800000
    retention.bytes: 536870912
    min.insync.replicas: 2
    cleanup.policy: delete