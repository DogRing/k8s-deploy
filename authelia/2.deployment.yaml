apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data-pvc
  namespace: authelia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
      - name: config-copy
        image: alpine:latest
        command: ["sh", "-c", "cp -fv /ro-config/* /config/"]
        volumeMounts:
        - name: config-ro
          mountPath: /ro-config
        - name: config-data
          mountPath: /config
      containers:
      - name: authelia
        image: authelia/authelia:latest
        ports:
        - containerPort: 9091
        env:
        - name: AUTHELIA_JWT_SECRET_FILE
          value: "/secrets/JWT_SECRET"
        - name: AUTHELIA_SESSION_SECRET_FILE
          value: "/secrets/SESSION_SECRET"
        - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
          value: "/secrets/STORAGE_ENCRYPTION_KEY"
        - name: AUTHELIA_DISABLE_KUBERNETES_SERVICE_ENV
          value: "true"
        volumeMounts:
        - name: config-data
          mountPath: /config
        - name: secrets
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: config-ro
        configMap:
          name: authelia-config
      - name: secrets
        secret:
          secretName: authelia-secrets
      - name: config-data
        persistentVolumeClaim:
          claimName: authelia-data-pvc
      securityContext:
       runAsUser: 1001
       runAsGroup: 1001
       fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: authelia
spec:
  selector:
    app: authelia
  ports:
  - port: 9091
    targetPort: 9091